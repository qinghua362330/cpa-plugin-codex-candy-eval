name: Company Upstream Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'qinghua362330/cpa-plugin-codex-candy-eval' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: python3 scripts/company-sync-test.py
      - name: Prepare conflict-free merge and unique version
        id: prepare
        run: python3 scripts/company-sync.py prepare
      - name: Validate before changing main
        if: steps.prepare.outputs.changed == 'true'
        run: |
          go vet ./...
          go test -race ./... -count=1
          node scripts/test-ui.cjs
          git diff --check
          git diff --cached --check
      - name: Commit and atomically push main plus tag
        if: steps.prepare.outputs.changed == 'true'
        env:
          COMPANY_TAG: ${{ steps.prepare.outputs.tag }}
        run: python3 scripts/company-sync.py publish
      - name: Report blocked sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/company-sync.py report

  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.sync.outputs.tag }}
