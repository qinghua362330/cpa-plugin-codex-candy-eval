name: Company Release

on:
  push:
    tags: ['v*-company.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing company tag (for example v0.4.4-company.1)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: company-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'qinghua362330/cpa-plugin-codex-candy-eval'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate exact company version and main ancestry
        env:
          COMPANY_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/company-sync.py verify-release
      - run: python3 scripts/company-sync-test.py
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: node scripts/test-ui.cjs
      - name: Build and package Linux amd64 (glibc 2.17)
        env:
          COMPANY_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/company-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: company-linux-amd64
          path: dist/company/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: company-linux-amd64
          path: assets
      - name: Publish immutable company assets as latest
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPANY_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c checksums.txt
          # No --clobber: existing releases are never overwritten.
          gh release create "$COMPANY_TAG" ./* --verify-tag \
            --title "$COMPANY_TAG" --generate-notes --prerelease=false --latest
